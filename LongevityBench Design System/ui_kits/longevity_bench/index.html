<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LongevityBench — Trust & Reasoning</title>
<link rel="icon" href="../../assets/insilico-badge.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="TrustView.jsx"></script>
<script type="text/babel" src="ResultsMatrix.jsx"></script>
<script type="text/babel" src="CompareView.jsx"></script>
<script type="text/babel" src="LiveRunsView.jsx"></script>
<script type="text/babel" src="RunsList.jsx"></script>
<script type="text/babel" src="RunDetail.jsx"></script>
<script type="text/babel" src="RecordDrawer.jsx"></script>
<script type="text/babel" src="NewRunModal.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  const [view, setView] = React.useState('trust');           // default to trust
  const [runs, setRuns] = React.useState(SEED_RUNS);
  const [openRun, setOpenRun] = React.useState(null);
  const [openRecord, setOpenRecord] = React.useState(null);
  const [showModal, setShowModal] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const liveCount = runs.filter(r => r.status === 'running').length;

  const handleOpenRun = (run) => {
    setOpenRun(run);
    setView('run-detail');
  };

  const handleBackToRuns = () => {
    setOpenRun(null);
    setView('runs');
  };

  const handleStartRun = (cfg) => {
    const newRun = {
      id: 'run_' + new Date().toISOString().slice(0, 16).replace(':', '-'),
      lbId: cfg.lbId,
      taskName: cfg.lbId === 'LB-0038' ? 'epistasis_ternary' : 'lifespan_mae',
      status: 'running',
      model: cfg.model,
      n: cfg.limit,
      completed: 0,
      errors: 0,
      f1: null, ci: null, bal_acc: null, mae: null, faithfulness: null,
      started: new Date().toISOString(),
      durationS: 0,
      think: cfg.think,
      spark: [0, 0, 0, 0, 0, 0, 0, 0],
    };
    setRuns([newRun, ...runs]);
    setShowModal(false);
    setView('runs');
    setToast({ msg: `Run started · ${cfg.lbId} · ${cfg.model}`, kind: 'pass' });
    setTimeout(() => setToast(null), 3200);
  };

  // Crumbs
  let crumbs;
  if (view === 'run-detail' && openRun) {
    crumbs = [
      { label: 'Live runs' },
      { label: openRun.lbId, mono: true },
      { label: openRun.id, mono: true },
    ];
  } else {
    const labels = {
      trust: 'Trust & reasoning',
      matrix: 'Eval matrix',
      compare: 'Model comparison',
      runs: 'Live runs',
      tasks: 'Tasks', models: 'Models', traces: 'Traces',
      synergyage: 'SynergyAge', mgi: 'MGI',
      settings: 'Settings',
    };
    crumbs = [{ label: labels[view] || 'Dashboard' }];
  }

  // Body
  let content;
  if (view === 'run-detail' && openRun) {
    content = <RunDetail run={openRun} records={SEED_RECORDS} onOpenRecord={setOpenRecord} />;
  } else if (view === 'trust') {
    content = <TrustView records={SEED_RECORDS} onOpenRecord={setOpenRecord} />;
  } else if (view === 'matrix') {
    content = <ResultsMatrix onOpenRecord={setOpenRecord} />;
  } else if (view === 'compare') {
    content = <CompareView />;
  } else if (view === 'runs') {
    content = <LiveRunsView runs={runs} onOpenRun={handleOpenRun} />;
  } else if (view === 'tasks') {
    content = <TasksPlaceholder />;
  } else if (view === 'models') {
    content = <ModelsPlaceholder />;
  } else {
    content = <GenericPlaceholder view={view} />;
  }

  return (
    <div className="app">
      <Sidebar view={view} setView={(v) => { setView(v); setOpenRun(null); }} runsCount={runs.length} liveCount={liveCount} />
      <div className="main">
        <TopBar
          crumbs={crumbs}
          onNewRun={() => setShowModal(true)}
          onRefresh={() => { setToast({ msg: 'Refreshed', kind: 'info' }); setTimeout(() => setToast(null), 1600); }}
        />
        <div className="content">
          {view === 'run-detail' && (
            <Button variant="ghost" size="small" onClick={handleBackToRuns} className="back-btn">
              ← Back to runs
            </Button>
          )}
          {content}
        </div>
      </div>
      {openRecord && <RecordDrawer record={openRecord} onClose={() => setOpenRecord(null)} />}
      {showModal && <NewRunModal onCancel={() => setShowModal(false)} onStart={handleStartRun} />}
      {toast && (
        <div className="toast">
          <span className="pill">{toast.kind === 'pass' ? '✓' : 'i'}</span>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

function GenericPlaceholder({ view }) {
  const titles = {
    synergyage: ['SynergyAge', 'Multi-gene longevity intervention experiments. ~2,500 records across C. elegans, D. melanogaster, mouse, yeast.'],
    mgi: ['MGI · Mouse Genome Informatics', 'Allele × phenotype annotations from MP:0010765 / MP:0010767 / MP:0002058.'],
    settings: ['Settings', 'Endpoint URL, HF token, NCBI API key, default seed.'],
  };
  const [title, sub] = titles[view] || ['Dashboard', 'Pick something in the sidebar.'];
  return (
    <>
      <div className="page-head">
        <div><h1>{title}</h1><div className="sub">{sub}</div></div>
      </div>
      <div className="card" style={{ padding: 40, textAlign: 'center' }}>
        <div className="lb-eyebrow" style={{ marginBottom: 8 }}>Coming soon</div>
        <p className="lb-p" style={{ color: 'var(--lb-fg-3)' }}>This screen is a stub. The main demo flow is <strong>Trust → Compare → Live runs → record drawer</strong>.</p>
      </div>
    </>
  );
}

function TasksPlaceholder() {
  const tasks = [
    { id: 'LB-0038', name: 'epistasis_ternary',  format: 'ternary',    n: 200, db: 'SynergyAge', icon: 'dnaHelix' },
    { id: 'LB-0042', name: 'lifespan_mae',        format: 'regression', n: 150, db: 'MGI',         icon: 'bacteria' },
    { id: 'LB-0051', name: 'gene_pathway_mcq',    format: 'mcq',        n: 200, db: 'NCBI + KEGG', icon: 'molecule' },
    { id: 'LB-0067', name: 'organism_pairwise',   format: 'pairwise',   n: 100, db: 'SynergyAge', icon: 'microscope' },
    { id: 'LB-0072', name: 'negation_binary',     format: 'binary',     n: 200, db: 'mixed',       icon: 'flaskConical' },
    { id: 'LB-0090', name: 'set_generation',      format: 'set',        n: 50,  db: 'WormBase',    icon: 'beaker' },
  ];
  return (
    <>
      <div className="page-head"><div><h1>Tasks</h1><div className="sub">6 LongeBench tasks · benchmark + extra splits</div></div></div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14 }}>
        {tasks.map(t => (
          <div key={t.id} className="card" style={{ padding: 16, display: 'flex', gap: 14, alignItems: 'center' }}>
            <div style={{ width: 44, height: 44, color: 'var(--lb-green-600)', flexShrink: 0 }}>
              <img src={`../../assets/scicons/${t.icon}.svg`} alt="" style={{ width: '100%', height: '100%' }} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ marginBottom: 4 }}><Pill brand>{t.id}</Pill></div>
              <div style={{ font: '500 14px var(--lb-font-sans)', color: 'var(--lb-fg-1)' }}>{t.name.replace(/_/g, ' ')}</div>
              <div className="lb-meta" style={{ marginTop: 2 }}>{t.format} · {t.db} · n={t.n}</div>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

function ModelsPlaceholder() {
  const models = [
    { id: 'longevity-llm', name: 'L-LLM',          sub: 'Insilico · Qwen3.5-9B fine-tuned', f1: 0.62, color: 'var(--lb-green-500)' },
    { id: 'gpt-4o',        name: 'GPT-4o',         sub: 'OpenAI · general purpose',          f1: 0.58, color: '#2a6dc8' },
    { id: 'majority',      name: 'Majority class', sub: 'baseline · most-frequent label',    f1: 0.42, color: '#c98b1c' },
    { id: 'random',        name: 'Random uniform', sub: 'baseline · 1000 seeds avg.',        f1: 0.33, color: '#8c948c' },
  ];
  return (
    <>
      <div className="page-head"><div><h1>Models</h1><div className="sub">Targets used in evaluation</div></div></div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 14 }}>
        {models.map(m => (
          <div key={m.id} className="card" style={{ padding: 18 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
              <div style={{ width: 36, height: 36, borderRadius: 6, background: m.color, display: 'grid', placeItems: 'center', color: '#fff', fontWeight: 500, fontSize: 13 }}>{m.name.slice(0, 2)}</div>
              <div>
                <div style={{ fontWeight: 500 }}>{m.name}</div>
                <div className="lb-meta">{m.sub}</div>
              </div>
              <div style={{ marginLeft: 'auto', fontFamily: 'var(--lb-font-mono)', fontSize: 22, fontWeight: 500 }}>{m.f1.toFixed(2)}</div>
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              {[0.6, 0.7, 0.5, 0.65, 0.8, 0.55, 0.7, 0.85].map((h, i) => (
                <div key={i} style={{ flex: 1, height: 36 * h, background: m.color, opacity: 0.3 + i * 0.08, borderRadius: 2 }} />
              ))}
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
