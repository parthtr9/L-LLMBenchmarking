<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand · logos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: #fff; }
  .card { padding: 22px 24px; }
  .label { font: 500 11px var(--lb-font-mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--lb-fg-3); margin: 0 0 16px; }
  .row { display:flex; align-items: center; gap: 32px; padding: 14px 0; border-top: 1px solid var(--lb-border); }
  .row:first-of-type { border-top: 0; padding-top: 4px; }
  .row .img { width: 130px; flex: 0 0 130px; display:flex; align-items: center; height: 40px; }
  .row .img img, .row .img svg { max-height: 40px; max-width: 100%; }
  .row .name { font: 500 14px var(--lb-font-sans); color: var(--lb-fg-1); flex: 0 0 220px; }
  .row .use { font: 400 13px var(--lb-font-sans); color: var(--lb-fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="label">Brand marks · property of Insilico Medicine</div>
  <div class="row">
    <div class="img"><img src="../assets/insilico-badge.svg" alt=""></div>
    <div class="name">ISM Badge</div>
    <div class="use">Favicon, collapsed sidebar, sponsor mention</div>
  </div>
  <div class="row">
    <div class="img"><img src="../assets/insilico-medicine-logo.svg" alt=""></div>
    <div class="name">Insilico Medicine</div>
    <div class="use">Footer, About, sponsor banner</div>
  </div>
  <div class="row">
    <div class="img"><img src="../assets/pharma-ai-logo.svg" alt=""></div>
    <div class="name">Pharma.ai</div>
    <div class="use">Cross-link to product suite</div>
  </div>
  <div class="row">
    <div class="img"><img src="../assets/pandaomics-logo.svg" alt=""></div>
    <div class="name">PandaOmics</div>
    <div class="use">Cross-link to omics platform</div>
  </div>
  <div class="row">
    <div class="img"><img src="../assets/inclinico-logo.svg" alt=""></div>
    <div class="name">inClinico</div>
    <div class="use">Cross-link to trial outcome prediction</div>
  </div>
</div>
</body>
</html>
