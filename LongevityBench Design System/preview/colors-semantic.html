<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colors — Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: #fff; }
  .card { padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tile { border: 1px solid var(--lb-border); border-radius: 6px; padding: 14px; }
  .dot { width: 18px; height: 18px; border-radius: 4px; margin-bottom: 10px; }
  .name { font: 500 14px var(--lb-font-sans); color: var(--lb-fg-1); margin: 0 0 2px; }
  .hex  { font: 400 11px var(--lb-font-mono); color: var(--lb-fg-3); }
  .tag  { display:inline-flex; align-items:center; gap:6px; padding: 3px 8px; border-radius: 4px; font: 500 11px var(--lb-font-sans); margin-top: 10px; }
  .tag::before { content:''; width:6px; height:6px; border-radius:50%; }
  .label { font: 500 11px var(--lb-font-mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--lb-fg-3); margin: 0 0 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Semantic states</div>
  <div class="grid">
    <div class="tile">
      <div class="dot" style="background:#4ca045"></div>
      <div class="name">Success</div>
      <div class="hex">#4ca045</div>
      <span class="tag" style="background:#f0f8ee;color:#2f6a2c"><span style="background:#4ca045"></span>Pass · F1 ≥ 0.6</span>
    </div>
    <div class="tile">
      <div class="dot" style="background:#c98b1c"></div>
      <div class="name">Warning</div>
      <div class="hex">#c98b1c</div>
      <span class="tag" style="background:#fcf3df;color:#8a5d12"><span style="background:#c98b1c"></span>Slow · &gt; 60s</span>
    </div>
    <div class="tile">
      <div class="dot" style="background:#c8392a"></div>
      <div class="name">Error</div>
      <div class="hex">#c8392a</div>
      <span class="tag" style="background:#fbe9e7;color:#8a2419"><span style="background:#c8392a"></span>Failed · 5xx</span>
    </div>
    <div class="tile">
      <div class="dot" style="background:#2a6dc8"></div>
      <div class="name">Info</div>
      <div class="hex">#2a6dc8</div>
      <span class="tag" style="background:#e7eefb;color:#1b4a8c"><span style="background:#2a6dc8"></span>Dry-run</span>
    </div>
  </div>
</div>
</body>
</html>
