<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: #fff; }
  .card { padding: 22px 24px; }
  .label { font: 500 11px var(--lb-font-mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--lb-fg-3); margin: 0 0 14px; }
  .row { display:flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }

  .btn { font: 500 14px var(--lb-font-sans); padding: 8px 16px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 120ms var(--lb-ease); }
  .btn.primary { background: var(--lb-green-500); color: #fff; }
  .btn.primary:hover { background: var(--lb-green-600); }
  .btn.secondary { background: #fff; color: var(--lb-fg-1); border-color: var(--lb-border-strong); }
  .btn.secondary:hover { background: var(--lb-ink-50); }
  .btn.ghost { background: transparent; color: var(--lb-fg-1); }
  .btn.ghost:hover { background: var(--lb-ink-50); }
  .btn.danger { background: var(--lb-error); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 12px; border-radius: 3px; }
  .btn.large { padding: 12px 22px; font-size: 15px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .key { font: 400 11px var(--lb-font-mono); color: var(--lb-fg-4); margin-left: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Buttons · variants</div>
  <div class="row">
    <button class="btn primary">Run benchmark</button>
    <button class="btn secondary">Cancel</button>
    <button class="btn ghost">View JSONL</button>
    <button class="btn danger">Delete run</button>
    <button class="btn primary" disabled>Disabled</button>
  </div>
  <div class="label" style="margin-top: 22px">Sizes</div>
  <div class="row">
    <button class="btn primary small">Re-score</button>
    <button class="btn primary">Run task</button>
    <button class="btn primary large">Start full eval</button>
  </div>
  <div class="label" style="margin-top: 22px">With state · icon</div>
  <div class="row">
    <button class="btn primary"><span class="dot"></span>Running · 4/20</button>
    <button class="btn secondary">↓ Export records.jsonl</button>
    <button class="btn ghost">⌘K<span class="key">cmd-k</span></button>
  </div>
</div>
</body>
</html>
