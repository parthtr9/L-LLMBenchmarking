models:
  longevity_llm:
    litellm_model: "openai/longevity-llm"
    api_base_env: "HF_ENDPOINT_URL"
    api_key_env: "HF_TOKEN"
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    max_concurrency: 8

  longevity_llm_thinking:
    litellm_model: "openai/longevity-llm"
    api_base_env: "HF_ENDPOINT_URL"
    api_key_env: "HF_TOKEN"
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
    max_concurrency: 4

  claude_sonnet:
    litellm_model: "anthropic/claude-sonnet-4-6"
    api_key_env: "ANTHROPIC_API_KEY"
    max_concurrency: 4

  random_baseline:
    type: baseline
    strategy: random

  majority_baseline:
    type: baseline
    strategy: majority

  population_prior_baseline:
    type: baseline
    strategy: population_prior
    csv_path: "data/task_b_lipidomics/nc-est2025-agesex-res.csv"
    year_col: "POPESTIMATE2025"
    age_min: 20
    age_max: 90
